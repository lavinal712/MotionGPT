target: mGPT.archs.mgpt_stream.StreamGenerator
params:
  latent_dim: 96
  text_dim: 768

  hidden_dim: 1024
  num_layers: 16
  num_heads: 16
  intermediate_dim: 2560
  num_cross_layers: 6
  cross_attention_type: local  # global / local
  cross_attention_sigma: 8.0

  num_languages: 3

  dropout: 0.0
  qk_norm: true
  rope_base: 10000.0
  norm_eps: 1e-6
